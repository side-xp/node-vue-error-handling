name: CI/CD

on:
  push:
    branches:
      - dev
      - develop
      - main
      - master
  # Run checks on every pull request, whatever branch it targets.
  pull_request:

jobs:
  check:
    name: Lint, types, tests, build & package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the coverage step post/update its comment on pull requests.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run coverage

      # Posts a coverage summary table as a sticky comment on pull requests.
      - name: Report coverage
        if: ${{ github.event_name == 'pull_request' }}
        uses: davelosert/vitest-coverage-report-action@v2

      - run: npm run build
      # publint + attw: validates the published package shape (exports, types resolution).
      - run: npm run check:package

      # The playgrounds are only type-checked by `npm run check`: building them catches a broken Vite or webpack setup.
      # Their scenarios are checked by hand (see CONTRIBUTING.md).
      - run: npm run playground:build
      - run: npm run playground-webpack:build

  # Runs the tests and the type-checking against the supported versions of the peer dependencies, other than the ones of
  # the lockfile: the oldest supported Vue, and both major versions of Vue Router.
  compatibility:
    name: Tests (Vue ${{ matrix.vue }}, Vue Router ${{ matrix.vue-router }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Vue. Vue Router 5 requires Vue ^3.5.34, so it's only tested with the latest Vue.
          - vue: 3.5.0
            vue-router: ^4
          # Latest supported versions (a new major version of Vue is excluded by the peer range of the package)
          - vue: ^3.5.0
            vue-router: ^4
          - vue: ^3.5.0
            vue-router: ^5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm install --no-save "vue@${{ matrix.vue }}" "vue-router@${{ matrix.vue-router }}"
      - name: Show the installed versions
        run: node -p "'vue ' + require('vue/package.json').version + ', vue-router ' + require('vue-router/package.json').version"
      - run: npm test
      - run: npm run verify

  # Publishes the package to npm and creates a GitHub release via semantic-release.
  # `npm publish` runs `prepublishOnly` (build + check:package) before `prepack` (build), so a broken package can never
  # be published. `prepublishOnly` must build on its own: it runs first, on a clean checkout without `dist`.
  # Auth uses npm Trusted Publishing (OIDC), not NPM_TOKEN. Requires a trusted publisher configured on npmjs.com (see
  # CONTRIBUTING.md).
  release:
    name: Release
    needs: [check, compatibility]
    concurrency:
      group: release
      cancel-in-progress: false
    if: >
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      && !github.event.repository.is_template
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Required for npm Trusted Publishing (OIDC) and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Do NOT set registry-url here: it writes an .npmrc that conflicts with semantic-release's OIDC auth
      # (EINVALIDNPMTOKEN).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
